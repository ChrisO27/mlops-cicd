name: CI # Darle nombre


on: # Indicamos el trigger
  push: # La accion que desencadena el triger
    branches:
      - main
    
jobs: # puede tener 1 o más jobs
  test:
    runs-on: ubuntu-latest #la maquina donde se hará la prueba

    steps:
      - name: Checkout_code
        uses: actions/checkout@v3 # descargar el repositorio
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      
      - name: Install requirements
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
        
      - name: Run flake8
        run: |
          source venv/bin/activate
          flake8 my_app main_v1_1.py
      
      - name: Run mypy
        run: |
          source venv/bin/activate
          mypy my_app --config-file mypy.ini

      - name: Run test
        run: |
          source venv/bin/activate
          python -m unittest tests/test_main_v1.py