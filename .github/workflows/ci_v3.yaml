name: CI # Darle nombre


on: # Indicamos el trigger
  push: # La accion que desencadena el triger
    branches:
      - main
    
jobs: # puede tener 1 o más jobs
  test:
    runs-on: ubuntu-latest #la maquina donde se hará la prueba

    steps:
      - name: Checkout_code
        uses: actions/checkout@v3 # descargar el repositorio
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      
      - name: Install requirements
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Run custom liner
        run: |
          source venv/bin/activate
          python custom_linter_v1.py my_app tests